name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build Android APK with Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          echo '{
            "appId": "com.hasan.salarypro",
            "appName": "Hasan Salary Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          npx cap add android
          
          # কোটলিন লাইব্রেরি কনফ্লিক্ট সমাধান করার জন্য গ্রেডল রুল যুক্ত করা হলো
          echo "
          configurations.all {
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
          }
          " >> android/app/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasan-Salary-Pro-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
