<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASAN Monthly Working and Salary Record</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf Library for PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 max-w-md mx-auto">

    <!-- Top Header Section -->
    <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-xl shadow-sm">
        <h1 class="font-bold text-blue-900 text-lg">HASAN SYSTEM</h1>
        <div id="currentMonthDisplay" class="font-semibold text-sm text-slate-600">November 2026</div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-2 mb-4">
        <button onclick="downloadPDF()" class="bg-indigo-600 text-white py-2 px-3 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">📥 Download PDF</button>
        <button onclick="saveCurrentData()" class="bg-blue-600 text-white py-2 px-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition">💾 Save Data</button>
    </div>

    <!-- Main Content Area for PDF Generation -->
    <div id="pdfContent" class="bg-white p-4 rounded-xl shadow-md space-y-4">
        
        <div class="text-center border-b pb-2">
            <h2 class="font-bold text-md text-slate-900">Monthly Working & Salary Record</h2>
            <p class="text-xs text-slate-500">Hasan Project Record System</p>
        </div>

        <!-- Employee Info Table -->
        <div class="border rounded-lg overflow-hidden">
            <table class="w-full text-xs">
                <tr class="border-b bg-slate-50">
                    <td class="p-2 font-semibold w-1/3">Employee Name:</td>
                    <td class="p-2"><input type="text" id="empName" placeholder="Enter Name" class="w-full bg-transparent outline-none border-b focus:border-blue-500"></td>
                </tr>
                <tr class="border-b">
                    <td class="p-2 font-semibold">ID No:</td>
                    <td class="p-2"><input type="text" id="empId" placeholder="Enter ID" class="w-full bg-transparent outline-none border-b focus:border-blue-500"></td>
                </tr>
                <tr class="border-b bg-slate-50">
                    <td class="p-2 font-semibold">Location:</td>
                    <td class="p-2"><input type="text" id="empLoc" placeholder="Enter Location" class="w-full bg-transparent outline-none border-b focus:border-blue-500"></td>
                </tr>
                <tr>
                    <td class="p-2 font-semibold">Rate Setup:</td>
                    <td class="p-2 text-blue-600 font-medium">Standard Rates Active</td>
                </tr>
            </table>
        </div>

        <!-- Summary Statistics -->
        <div class="grid grid-cols-2 gap-2 text-center">
            <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                <span class="text-[10px] text-slate-500 block">Total Working Hours</span>
                <span id="totalHrs" class="font-bold text-blue-900 text-sm">0.00 hrs</span>
            </div>
            <div class="bg-emerald-50 p-2 rounded-lg border border-emerald-100">
                <span class="text-[10px] text-slate-500 block">Total Earnings</span>
                <span id="totalPay" class="font-bold text-emerald-700 text-sm">RM 0.00</span>
            </div>
        </div>

        <!-- Quick Calculator Box -->
        <div class="bg-slate-50 p-3 rounded-lg border space-y-2">
            <h3 class="text-xs font-bold text-slate-700">Quick Daily Entry</h3>
            <div class="grid grid-cols-4 gap-1 text-center text-[10px]">
                <div>
                    <label class="block text-slate-500">Normal</label>
                    <input type="number" id="inputNormal" value="8" class="w-full text-center border rounded p-1">
                </div>
                <div>
                    <label class="block text-slate-500">Overtime</label>
                    <input type="number" id="inputOT" value="2" class="w-full text-center border rounded p-1">
                </div>
                <div>
                    <label class="block text-slate-500">Sunday</label>
                    <input type="number" id="inputSun" value="0" class="w-full text-center border rounded p-1">
                </div>
                <div>
                    <label class="block text-slate-500">PHD</label>
                    <input type="number" id="inputPHD" value="0" class="w-full text-center border rounded p-1">
                </div>
            </div>
            <button onclick="calculateSalary()" class="w-full bg-slate-800 text-white text-xs py-1.5 rounded mt-2 hover:bg-black transition">Calculate & Update</button>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        function calculateSalary() {
            const n = parseFloat(document.getElementById('inputNormal').value) || 0;
            const ot = parseFloat(document.getElementById('inputOT').value) || 0;
            const sun = parseFloat(document.getElementById('inputSun').value) || 0;
            const phd = parseFloat(document.getElementById('inputPHD').value) || 0;

            const totalHours = n + ot + sun + phd;
            // Rates calculation (Normal rate: 9, OT/Sun/PHD: 13.5)
            const pay = (n * 9) + (ot * 13.5) + (sun * 13.5) + (phd * 13.5);

            document.getElementById('totalHrs').innerText = totalHours.toFixed(2) + " hrs";
            document.getElementById('totalPay').innerText = "RM " + pay.toFixed(2);
        }

        function saveCurrentData() {
            const data = {
                name: document.getElementById('empName').value,
                id: document.getElementById('empId').value,
                location: document.getElementById('empLoc').value,
                totalHrs: document.getElementById('totalHrs').innerText,
                totalPay: document.getElementById('totalPay').innerText
            };
            localStorage.setItem('hasan_salary_data', JSON.stringify(data));
            alert('Data saved successfully in browser storage!');
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const opt = {
                margin:       1,
                filename:     'Hasan_Salary_Record.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        // Load saved data on startup
        window.onload = function() {
            const saved = localStorage.getItem('hasan_salary_data');
            if(saved) {
                const data = JSON.parse(saved);
                document.getElementById('empName').value = data.name || '';
                document.getElementById('empId').value = data.id || '';
                document.getElementById('empLoc').value = data.location || '';
                if(data.totalHrs) document.getElementById('totalHrs').innerText = data.totalHrs;
                if(data.totalPay) document.getElementById('totalPay').innerText = data.totalPay;
            }
        }
    </script>

    <!-- Service Worker Registration Script -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker registered!', reg))
            .catch((err) => console.log('Service Worker registration failed', err));
        });
      }
    </script>
</body>
</html>
